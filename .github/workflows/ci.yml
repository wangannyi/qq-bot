name: public-release-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Bootstrap a clean environment
        run: python scripts/bootstrap.py --venv .venv --dev
      - name: Lint
        run: .venv/bin/python -m ruff check . --select E9,F,I
      - name: Offline regressions
        run: .venv/bin/python -m pytest -q
      - name: Offline example
        run: .venv/bin/python scripts/offline_demo.py
      - name: Public artifact checks
        run: .venv/bin/python scripts/check_release.py
      - name: Whitespace
        run: git diff --check
